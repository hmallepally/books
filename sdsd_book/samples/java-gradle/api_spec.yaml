version: "1.0"
spec_type: "api"
feature_name: "AuthService"

boundaries:
  inputs:
    - name: tenantId
      type: string
    - name: username
      type: string
    - name: password
      type: string

invariants:
  - id: INV-001
    description: "Tenant Isolation: All authentication attempts must explicitly provide a valid tenantId. Tenant boundaries must not be crossable."
    enforcement_level: "FATAL"
