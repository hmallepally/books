[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdsd-cli"
version = "0.1.0"
description = "Spec-Driven Secure Development CLI — Assemble secure, context-rich prompts for AI coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Harinath Mallepally" },
]
keywords = ["sdsd", "ai", "security", "prompt-engineering", "spec-driven"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "typer[all]>=0.9.0",
    "pyyaml>=6.0",
    "pyperclip>=1.8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sdsd = "sdsd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sdsd"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
